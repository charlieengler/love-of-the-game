<!DOCTYPE html>
<html>

<head>
    <title>Blackjack</title>

    <script src="../../cookies.js" type="text/javascript"></script>
    <script src="../../network.js" type="text/javascript"></script>
    <script src="../common/cards.js" type="text/javascript"></script>

    <script src="./hand_management.js" type="text/javascript"></script>
    <script src="./table_management.js" type="text/javascript"></script>
    <script src="./user_management.js" type="text/javascript"></script>

    <link rel="stylesheet" href="./blackjack.css">

    <script type="text/javascript">
        const setUserID = () => {
            const userID = getCookie("userID");

            if (!userID) {
                window.location.href = "http://localhost:3000/users/auth.html";
            }

            const userIDSetup = document.getElementById("user-id-setup");

            userIDSetup.innerText = userID;
        }
    </script>
</head>

<body onload="setUserID()" style="background-color: #222; color: white;">
    <div class="setup" id="setup-window">
        <h1>Get Started</h1>
        <div style="text-align: left;">
            <h2 id="user-id-setup"></h2>
            <input class="setup-input" id="table-id-input" placeholder="Table ID" />
            <button class="setup-button" id="join-table-button" onclick="joinTable()">Join Table</button>
            <h2 id="table-id-setup"></h2>
            <input class="setup-input" id="bet-value-input" placeholder="Bet" type="number" />
            <button class="setup-button" id="place-bet-button" onclick="placeBet()">Place Bet</button>
        </div>
    </div>

    <button class="start-hand-button" id="progress-hand" onclick="progressHand()">Start Hand</button>

    <br />

    <h1 style="display: inline-block;">Table ID:&nbsp;</h1>
    <h1 id="table-id" style="display: inline-block;"></h1>
    <br />
    <h2 style="display: inline-block;">User ID:&nbsp;</h2>
    <h2 id="user-id" style="display: inline-block;"></h2>
    <br />
    <h2 style="display: inline-block">Current Bet:&nbsp;</h2>
    <h2 id="bet-value" style="display: inline-block;"></h2>

    <br />
    <br />
    <div class="dealer-card-table" id="dealer-card-table"></div>
    <div class="user-card-table" id="user-card-table"></div>
</body>

</html>
