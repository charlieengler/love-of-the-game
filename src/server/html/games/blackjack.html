<!DOCTYPE html>
<html>
    <head>
        <title>Blackjack</title>

        <script src="./common/cards.js" type="text/javascript"></script>

        <script>
            const submitData = async (path, data) => {
                try {
                    const res = await fetch(path, {
                        method: "POST",
                        body: JSON.stringify(data),
                        headers: {
                            "Content-type": "application/json",
                        },
                    });

                    const reader = res.body.getReader();

                    const rawData = [];
                    let { done, value } = await reader.read();

                    if(value != null) {
                        rawData.push(value);
                    }

                    // TODO: This is causing issues with reading forever
                    // while(!done) {
                    //     ({ done, value } = await reader.read());
                    //
                    //     if(value != null)
                    //         rawData.push(value);
                    // }

                    const parsedData = [];

                    for(let i = 0; i < rawData.length; i++) {
                        const chunkString = new TextDecoder().decode(rawData[i]);

                        parsedData.push(JSON.parse(chunkString));
                    }

                    return parsedData;
                } catch(err) {
                    console.error("Unable to fetch server data: ", err);
                }
            }

            const joinTable = async () => {
                const userID = document.getElementById("user-id-input").value;
                const tableID = document.getElementById("table-id-input").value;

                const data = {
                    userID: userID,
                    tableID: tableID,
                };

                const res = (await submitData("http://localhost:3000/routes/games/blackjack/join-table", data))[0];

                document.getElementById("table-id").innerText = res.tableID;
                document.getElementById("user-id").innerText = res.userID;
            }

            const placeBet = async () => {
                const userID = document.getElementById("user-id-input").value;
                const tableID = document.getElementById("table-id-input").value;
                const bet = document.getElementById("bet-value-input").value;

                const data = {
                    userID: userID,
                    tableID: tableID,
                    bet: bet,
                };

                const res = (await submitData("http://localhost:3000/routes/games/blackjack/bet", data))[0];

                document.getElementById("table-id").innerText = res.tableID;
                document.getElementById("user-id").innerText = res.userID;
                document.getElementById("bet-value").innerText = res.bet;
            }

            const startHand = async () => {
                const userID = document.getElementById("user-id-input").value;
                const tableID = document.getElementById("table-id-input").value;

                const data = {
                    userID: userID,
                    tableID: tableID,
                };

                const res = (await submitData("http://localhost:3000/routes/games/blackjack/start-hand", data))[0];

                const users = res.users.split(',');
                const dealerCards = parseCardIndexString(res.dealerCards);
                const userCards = parseCardIndexString(res.userCards);

                document.getElementById("dealer-card-table").innerHTML = '';
                document.getElementById("user-card-table").innerHTML = '';

                for(let i = 0; i < users.length; i++) {
                    const newHand = document.createElement("div");
                    newHand.id = "player-" + users[i] + "-cards";
                    document.getElementById("user-card-table").appendChild(newHand);
                }

                generateCardGraphic(dealerCards[0], "dealer-card-table");

                for(let i = 0; i < userCards.length; i += 2) {
                    generateCardGraphic(userCards[i], "player-" + users[Math.floor(i/2)] + "-cards");
                }

                for(let i = 1; i < userCards.length; i += 2) {
                    generateCardGraphic(userCards[i], "player-" + users[Math.floor(i/2)] + "-cards");
                }

                document.getElementById("hit-button").disabled = false;
                document.getElementById("stand-button").disabled = false;
            }

            const hit = async () => {

            }

            const stand = async () => {

            }
        </script>
    </head>

    <body style="background-color: black; color: white;">
        <input id="user-id-input" placeholder="User ID"/>
        <input id="table-id-input" placeholder="Table ID"/>
        <button onclick="joinTable()">Join Table</button>
        <input id="bet-value-input" placeholder="Bet" type="number"/>
        <button onclick="placeBet()">Place Bet</button>

        <button onclick="startHand()">Start Hand</button>

        <button disabled id="hit-button" onclick="hit()">Hit</button>
        <button disabled id="stand-button" onclick="stand()">Stand</button>

        <br/>

        <h1 style="display: inline-block;">Table ID:&nbsp;</h1><h1 id="table-id" style="display: inline-block;"></h1>
        <br/>
        <h2 style="display: inline-block;">User ID:&nbsp;</h2><h2 id="user-id" style="display: inline-block;"></h2>
        <br/>
        <h2 style="display: inline-block">Current Bet:&nbsp;</h2><h2 id="bet-value" style="display: inline-block;"></h2>

        <br/>
        <br/>
        <div id="dealer-card-table"></div>
        <div id="user-card-table"></div>
    </body>
</html>
