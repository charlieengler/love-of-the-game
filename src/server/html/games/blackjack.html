<!DOCTYPE html>
<html>
    <head>
        <title>Blackjack</title>

        <script>
            const submitData = async (path, data) => {
                fetch(path, {
                    method: "POST",
                    body: JSON.stringify(data),
                    headers: {
                        "Content-type": "application/json",
                    },
                }).then(async res => {
                    const reader = res.body.getReader();

                    const rawData = [];
                    let { done, value } = await reader.read();

                    if(value != null)
                        rawData.push(value);

                    while(!done) {
                        ({ done, value } = await reader.read());

                        if(value != null)
                            rawData.push(value);
                    }

                    return rawData;
                }).then(chunks => {
                    for(let i = 0; i < chunks.length; i++) {
                        const chunkString = new TextDecoder().decode(chunks[i]);

                        console.log(JSON.parse(chunkString));
                    }
                }).catch(err => {
                    console.error("Unable to fetch server data: ", err);
                });
            }

            const joinTable = () => {
                const userID = document.getElementById("user-id").value;
                const tableID = document.getElementById("table-id").value;
                const data = {
                    userID: userID,
                    tableID: tableID,
                };

                submitData("http://localhost:3000/routes/games/blackjack/join-table", data);
            }

            const placeBet = () => {
                const bet = document.getElementById("bet-value").value;
                const data = {
                    amount: bet,
                };

                submitData("http://localhost:3000/routes/games/blackjack/bet", data);
            }
        </script>
    </head>

    <body style="background-color: black; color: white;">
        <input id="user-id" placeholder="User ID"/>
        <input id="table-id" placeholder="Table ID"/>
        <button onclick="joinTable()">Join Table</button>
        <input id="bet-value" placeholder="Bet" type="number"/>
        <button onclick="placeBet()">Place Bet</button>
    </body>
</html>
