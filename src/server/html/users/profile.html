<!DOCTYPE html>
<html>

<head>
    <title>Profile</title>

    <script src="../../network.js" type="text/javascript"></script>
    <script src="../../cookies.js" type="text/javascript"></script>
    <script src="./authenticate.js" type="text/javascript"></script>

    <script>
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        const loadUser = async () => {
            const userID = getCookie("userID");

            if (!userID) {
                window.location.href = "http://localhost:3000/users/auth.html";
            }

            const data = {
                userID: userID,
            };

            const res = (await submitData("http://localhost:3000/routes/users/auth/find", data))[0];

            if (!res.foundUser) {
                window.location.href = "http://localhost:3000/users/auth.html";
            }

            document.getElementById("username").innerText = userID;
            document.getElementById("logout-button").style.display = "block";

            // const time = document.getElementById("last-login-time");
            // time.innerText = res.last_login.hour + ":" + res.last_login.minute + "." + res.last_login.second;
            //
            // const date = document.getElementById("last-login-date");
            // date.innerText = res.last_login.day + " " + months[res.last_login.month - 1] + ", " + res.last_login.year;
        }
    </script>
</head>

<body onload="loadUser()" style="background-color: #222; color: white;">
    <button id="logout-button" onclick="logout()" style="display: none;">Log Out</button>
    <h1 id="username"></h1>
    <!-- <p id="last-login-time"></p> -->
    <!-- <p id="last-login-date"></p> -->
</body>

</html>
